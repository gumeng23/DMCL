appId: com.dmcl.launcher
productName: DMCL
copyright: Copyright © 2026 DMCL Team

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/.npm-cache/**"
  - "!**/.electron-cache/**"

asar: true
npmRebuild: false
compression: normal
removePackageScripts: true

win:
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

portable:
  artifactName: DMCL-${version}-portable.${ext}
  requestExecutionLevel: user
  unpackDirName: DMCL

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DMCL
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: DMCL-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
